[project]
name = "cairn"
version = "0.1.0"
description = "Cairn: a company brain on FalkorDB that remembers why"
readme = "README.md"
authors = [
    { name = "Khundrakpam Bikash Meitei", email = "khbikash18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.8.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
cairn = "cairn.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 165
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]  # typographic quotes/arrows in user-facing strings are intentional

[tool.ruff.lint.per-file-ignores]
"src/cairn/samples/*.py" = ["E501"]  # sample conversations are prose

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
